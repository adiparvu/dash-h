name: CI

# Builds and tests PRVIO EARTH on macOS: generates the Xcode project from
# project.yml with XcodeGen, then compiles the app, widget and framework and
# runs the Swift Testing suite on an iOS simulator. This is what actually
# verifies the build (Xcode is macOS-only).

on:
  push:
    branches: ["**"]
    paths:
      - "PrvioEarth/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "PrvioEarth/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: PrvioEarth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); ids=[dev['udid'] for runt,devs in d['devices'].items() if 'iOS' in runt for dev in devs if dev.get('isAvailable') and 'iPhone' in dev['name']]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo "No iOS simulator available"; exit 1; fi
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project PrvioEarth.xcodeproj \
            -scheme PrvioEarth \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
          | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: PrvioEarth/TestResults.xcresult
          if-no-files-found: ignore
